<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PlanAhead</title>
  <meta name="description" content="Know exactly when to start getting ready and when to leave. PlanAhead adds your prep tasks, live travel time and a buffer into one timeline." />
  <meta name="theme-color" content="#F3F2ED" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <script>
    // Apply the saved theme before first paint so there's no flash.
    try { var t = localStorage.getItem('planahead:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"><div class="boot"><span class="logo"></span></div></div>
  <noscript>PlanAhead needs JavaScript to work.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
